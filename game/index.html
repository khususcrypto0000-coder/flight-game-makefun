<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Island Hopper — Flight Game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #06283f; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 12px;
  }
  #wrap {
    width: min(1280px, 100%);
    background: #0a2f4a;
    border-radius: 14px;
    padding: 12px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  }
  #game {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
    background: #1d6fb8;
    cursor: crosshair;
  }
  #controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
    align-items: center;
  }
  #controls button {
    font: bold 15px system-ui, sans-serif;
    color: #08283f;
    background: #ffd23e;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
  }
  #controls button:hover { background: #ffdf6b; }
  #controls button.secondary { background: #d7e6ef; }
  #controls button.secondary:hover { background: #ffffff; }
  #hint {
    font-size: 13px;
    color: #bcd8e8;
    margin-left: auto;
  }
  #title {
    font-size: 15px;
    color: #bcd8e8;
    margin-bottom: 8px;
  }
  #title b { color: #ffd23e; }
</style>
</head>
<body>
  <div id="wrap">
    <div id="title"><b>ISLAND HOPPER</b> — terbang antar pulau, lewati 5 ring, mendarat di runway tujuan. Misi 1 dari 3. <span id="status">Bahan bakar terbatas — mendarat untuk mengisi ulang.</span></div>
    <canvas id="game" width="1280" height="800"></canvas>
    <div id="controls">
      <button id="btn-start" type="button">▶ START</button>
      <button id="btn-pause" type="button" class="secondary">⏸ PAUSE</button>
      <button id="btn-restart" type="button" class="secondary">↻ RESTART</button>
      <button id="btn-mute" type="button" class="secondary">🔊 SOUND</button>
      <span id="hint">W/S throttle &nbsp;•&nbsp; A/D belok &nbsp;•&nbsp; ↑/↓ pitch &nbsp;•&nbsp; SPACE rem udara &nbsp;•&nbsp; tahan mouse untuk mengarah</span>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
